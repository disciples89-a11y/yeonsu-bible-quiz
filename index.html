<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>매일 성경퀴즈 - 연수소망교회</title>
<style>
:root{--bg:#f4efe4;--card:#fff;--ink:#2a2a2a;--sub:#6b6b6b;--main:#2f5d8a;--ok:#1f9d57;--okbg:#e6f6ec;--no:#d64545;--nobg:#fdeaea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;line-height:1.65;font-size:17px}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 60px}
header{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px}
header h1{font-size:18px;margin:0;color:var(--main)}
.snd{border:1px solid #ccc;background:#fff;border-radius:20px;padding:5px 12px;font-size:14px;cursor:pointer}
.card{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.07);margin-bottom:14px}
.tag{display:inline-block;background:var(--main);color:#fff;border-radius:12px;padding:2px 12px;font-size:14px;margin-bottom:8px}
.q{font-weight:700;font-size:18px;margin:6px 0 14px}
.sentence{font-size:18px;margin:6px 0 14px;line-height:2}
.blank{display:inline-block;min-width:64px;text-align:center;border-bottom:3px solid var(--main);color:var(--main);font-weight:700;padding:0 6px}
.blank.cur{background:#fff6cc}
.blank.ok{color:var(--ok);border-color:var(--ok)}
.blank.no{color:var(--no);border-color:var(--no)}
.choice{display:block;width:100%;text-align:left;border:2px solid #d9d9d9;background:#fff;border-radius:12px;padding:13px 14px;margin:9px 0;font-size:17px;font-family:inherit;color:inherit;cursor:pointer}
.choice:active{transform:scale(.99)}
.choice .no{font-weight:700;color:var(--main);margin-right:8px}
.choice.right{border-color:var(--ok);background:var(--okbg)}
.choice.wrong{border-color:var(--no);background:var(--nobg)}
.choice:disabled{cursor:default}
.fb{border-radius:12px;padding:12px 14px;font-weight:700;font-size:19px;margin:12px 0}
.fb.ok{background:var(--okbg);color:var(--ok);animation:pop .4s}
.fb.no{background:var(--nobg);color:var(--no);animation:shake .4s}
.expl{background:#faf7ef;border-left:5px solid var(--main);border-radius:8px;padding:12px 14px;margin:12px 0;font-size:16px;white-space:pre-wrap}
.expl b{color:var(--main)}
.btn{display:block;width:100%;border:0;background:var(--main);color:#fff;border-radius:12px;padding:14px;font-size:18px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:10px}
.btn.alt{background:#fff;color:var(--main);border:2px solid var(--main)}
.sub{color:var(--sub);font-size:14px}
.big{font-size:56px;text-align:center;margin:6px 0}
.center{text-align:center}
select{font-size:16px;padding:8px;border-radius:8px;border:1px solid #ccc;font-family:inherit;max-width:100%}
.dots{display:flex;gap:6px;margin-bottom:10px}
.dot{flex:1;height:7px;border-radius:4px;background:#ddd}.dot.on{background:var(--main)}.dot.ok{background:var(--ok)}.dot.no{background:var(--no)}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style></head><body><div class="wrap">
<header><h1>매일 성경퀴즈</h1><button class="snd" id="snd">소리 켬</button></header>
<div id="app"></div>
<p class="sub center">연수소망교회 · 사사기 읽기 퀴즈</p>
</div>
<script>
var DATA=[{"n":42,"question":"돌라와 야일에 관한 기록은 시시하기 짝이 없습니다. 이들의 이름을 성경에 기록하면서도 행적을 낱낱이 적지 않은 까닭은 무엇입니까?","expl":"돌라에게는 “이스라엘을 구원했다”라는 사사에게 적용되는 전형적인 표현이 쓰였고, 돌라와 야일 모두 “이스라엘의 사사로 있었다”는 표현이 공통적으로 쓰였습니다. 그 앞에 있던 아비멜렉은 “내 아버지가 왕이다”라는 거창한 뜻의 이름을 지녔고 스스로 왕이 되고자 했던 반면, 돌라와 야일은 사사로서 긴 세월을 무탈하게 지냈다고 볼 수 있습니다. 특히 돌라의 경우 아비멜렉 바로 다음에 놓였다는 점에서, 요란했던 아비멜렉 시기와 특히 대조됩니다. 그가 어떤 삶을 살았는지 구체적으로 알려지지 않았지만, 돌라는 20년이 넘는 세월 동안 이스라엘의 사사로 살면서 자신에게 주어진 일을 충실히 수행했습니다. 어쩌면 이 두 사사를 기록한 본문은 아비멜렉 이후 잠깐 동안의 평범한 평화를 보여준다고 할 수 있습니다.","c1":["요란했던 아비멜렉 시기와 대조되는, 사사로서 긴 세월을 무탈하게 지낸 평범한 평화를 보여주기 때문","두 사사가 큰 죄를 지어 행적을 감추고 싶었기 때문","기록하는 사람이 두 사사의 이야기를 자세히 알지 못했기 때문"],"t2":"돌라와 야일 모두 “이스라엘의 {0}로 있었다”는 표현이 쓰였고, 앞에 있던 아비멜렉이 스스로 {1}이 되고자 했던 것과 달리 이들은 긴 세월을 무탈하게 지냈습니다.","b2":[["사사","선지자","제사장"],["왕","장군","제사장"]],"ref":"사사기 10:1-5","chap":10,"sec":1},{"n":43,"question":"6절을 보면 이스라엘 백성이 섬기는 신이 갈수록 다양해지는 느낌입니다. 이들은 왜 하나님보다 이런 신들에 더 쉽게 매료되었을까요?","expl":"바알 종교로 대표되는 이방 종교는 ‘넘쳐나는 제사와 약속된 풍요’라는 틀로 요약할 수 있습니다. 정성 가득한 많은 제물을 바치면 신이 예배자에게 풍요를 약속한다는 것입니다. 중요한 점은 바알을 흡족하게 하는 정성 가득한 제물입니다. 그래서 이러한 종교는 하나님의 규례를 따르는 일상의 정의로운 삶이 그리 중요하지 않습니다. 반면 주 하나님께서는 제물로 통제할 수 있는 신이 아니었고, 아무리 많은 제물을 갖다 바쳐도 그 삶이 합당하지 않으면 헛된 제사라 선언하십니다. 곰곰이 따져보면, 결국 우리 또한 종교가 삶의 전 영역을 지배하기보다는 마음의 평화나 복을 주는 일정한 기능만 수행하기를 원할 때가 많다 싶습니다. 고대 바알 종교와 그리 다르지 않은 것이지요.","c1":["바알 종교는 정성 가득한 제물만 바치면 풍요를 약속해서, 하나님의 규례를 따르는 정의로운 삶이 그리 중요하지 않기 때문","바알 종교는 제물 없이도 구원을 약속하는 쉬운 종교였기 때문","하나님께서 이스라엘을 버리시고 더 이상 예배를 받지 않으셨기 때문"],"t2":"바알 종교로 대표되는 이방 종교는 ‘넘쳐나는 {0}와 약속된 {1}’이라는 틀로 요약할 수 있습니다.","b2":[["제사","기도","전쟁"],["풍요","평화","심판"]],"ref":"사사기 10:6-16","chap":10,"sec":6},{"n":44,"question":"입다는 출신도 천하고 지닌 것도 변변찮은 하류인생이었습니다(1–3절). 하나님은 어째서 그런 인물들을 사사로 세웁니까?","expl":"입다의 어머니는 창녀였는데, 여호수아 시대 여리고 싸움과 연관된 중요한 인물인 라합 또한 창녀였습니다. 입다는 천한 출신으로 집안에서 밀려나 사회의 주변부를 맴돌며 자기를 따르는 이들을 모았던 인물인데, 이렇게 미미한 출신으로 태어나 사회 주변부를 맴돌며 따르던 이들을 규합했던 또 다른 인물로는 다윗이 있습니다. 사실 구약성경에 등장하는 신앙의 본보기 가운데 그럴싸한 집안 출신이 누가 있을까 싶기도 합니다. 하나님께서 행하시는 일을 증언한 구약성경에는 이처럼 온통 밀려난 자, 이집트의 노예였던 백성, 창녀, 창녀의 자식들의 이야기로 가득합니다. 처음부터 하나님께서는 밀려난 자의 하나님이시며, 천한 자의 하나님이셨습니다.","c1":["하나님은 처음부터 밀려난 자의 하나님이시며, 천한 자의 하나님이시기 때문","출신이 천해야 겸손하여 순종을 잘하기 때문","다른 지파에서는 쓸 만한 인물을 찾지 못했기 때문"],"t2":"입다의 어머니는 창녀였는데, 여리고 싸움과 연관된 {0}도 창녀였습니다. 처음부터 하나님께서는 {1}의 하나님이시며, 천한 자의 하나님이셨습니다.","b2":[["라합","드보라","룻"],["밀려난 자","강한 자","부유한 자"]],"ref":"사사기 11:1-11","chap":11,"sec":1},{"n":45,"question":"11절은 입다가 장로들과 나눈 대화를 ‘주님께’ 말씀드렸다고 합니다. 건달 우두머리의 행동으로는 아주 낯선 편인데, 도대체 왜 이러는 걸까요?","expl":"고대 이스라엘에서 하나님에 대한 신앙은 일종의 기본값이라고 볼 수 있습니다. 그런데 이런 신앙이 그 사회 분위기에 따라 바알 종교에 휩쓸리기도 하고 다른 종교와 뒤엉키기도 합니다. 그리고 당시 사회 주류에 속한 이들의 시선에는 입다 패거리가 건달패로 보였겠지만, 언제나 주류 사회의 문제를 바로잡고 근본적으로 변화시키는 것은 내부의 개혁이 아니라 주류 사회가 건달이라 치부하는 변두리 사람에 의한 변화입니다. 주류 세력이 보기에는 건달이었지만, 본문에서 묘사한 입다와 그의 무리는 주 하나님을 신뢰하며 그분의 뜻을 묻고 구하는 이들이었습니다. 오히려 이들이야말로 주 하나님에 대한 신앙을 좀 더 온전하게 간직한 이들이었다고 할 수 있습니다.","c1":["주류 사회가 건달이라 치부하던 변두리 사람들이 오히려 주 하나님을 신뢰하며 그분의 뜻을 묻고 구하는 이들이었기 때문","입다가 장로들 앞에서 신앙심을 꾸며 보이려 했기 때문","장로들이 요구한 필수 의식 절차였기 때문"],"t2":"사회를 근본적으로 변화시키는 것은 주류 사회가 건달이라 치부하는 {0} 사람에 의한 변화입니다. 입다와 그의 무리는 주 하나님을 {1}하며 그분의 뜻을 묻고 구하는 이들이었습니다.","b2":[["변두리","부유한","권력 있는"],["신뢰","의심","이용"]],"ref":"사사기 11:1-11","chap":11,"sec":1},{"n":46,"question":"‘암몬 자손의 왕’(13절)이라는 표현이 기묘합니다. 똑 부러지게 어느 나라의 왕이라고 말하지 않는 이유는 무엇입니까?","expl":"암몬은 구약에 100회 이상 언급되는데, 두 경우(삼상 11:11; 시 83:7)를 제외하고 항상 ‘암몬 자손’이라고 표현됩니다. 다른 이방 나라와는 달리 왜 암몬만 항상 그렇게 표현되는지는 정확히 알 수 없지만, 어찌 됐건 ‘암몬 자손’이라는 표현은 명확하게 암몬이라는 특정한 이방 나라를 가리킵니다. 다른 나라의 경우에는 ‘자손’이라는 말이 붙을 때도 있고 그렇지 않을 때도 있으나, 이스라엘에는 ‘자손’이라는 말이 자주 붙습니다. 현대인과는 달리, 고대 사람들은 지금 존재하는 민족이 거슬러 올라가면 결국 누군가의 후손이라는 것을 이러한 표현 방식을 통해 드러낸다고 이해할 수 있습니다.","c1":["‘자손’이라는 표현이 암몬이라는 특정한 이방 나라를 명확하게 가리키며, 고대 사람들은 민족이 누군가의 후손이라는 것을 이렇게 드러냈기 때문","암몬에는 왕이 없고 부족장만 있었기 때문","성경 기록자가 암몬 왕의 이름을 알지 못했기 때문"],"t2":"암몬은 구약에 100회 이상 언급되는데 두 경우를 제외하고 항상 ‘암몬 {0}’이라고 표현됩니다. 고대 사람들은 민족이 거슬러 올라가면 결국 누군가의 {1}이라는 것을 이런 표현으로 드러냈습니다.","b2":[["자손","백성","군대"],["후손","노예","원수"]],"ref":"사사기 11:12-28","chap":11,"sec":12},{"n":47,"question":"입다가 그모스 신(24절)을 들먹이는 까닭은 무엇입니까? 그 신의 존재와 능력을 인정한다는 뜻인가요?","expl":"구약 시대에는 대체로 다른 민족이 섬기는 다른 종교를 부정하거나 핍박하지 않았습니다. 이스라엘에게 문제가 되는 것은 그들은 주 하나님을 섬기는 이들로 부름받았는데 하나님이 아닌 다른 것에 굽신거리거나 숭배한다는 점입니다. 그러나 주변의 다른 민족이 각각 자신들의 신을 섬기는 것을 문제시하지는 않습니다. 그 점에서 구약 신앙은 제국주의나 종교적 배타주의와는 거리가 멉니다. 다른 신은 없으며 오직 하나님 한 분뿐이라는 신앙이 생겨나는 것은 구약 시대 후반기, 이스라엘이 더 이상 나라로 존재하지 않던 시절이었습니다. 나라가 없어지자 주 하나님이 온 세상의 유일하신 하나님임을 고백하게 된 것입니다.","c1":["당시에는 다른 민족이 섬기는 신을 부정하거나 핍박하지 않았고, 오직 한 분 하나님이라는 신앙은 훨씬 후대에 생겼기 때문","입다가 그모스의 능력이 하나님과 같다고 믿었기 때문","그모스를 섬기는 암몬 사람들을 개종시키려 했기 때문"],"t2":"다른 신은 없으며 오직 하나님 한 분뿐이라는 신앙은 구약 시대 {0}기, 이스라엘이 더 이상 {1}로 존재하지 않던 시절에 생겨났습니다.","b2":[["후반","초반","중반"],["나라","민족","지파"]],"ref":"사사기 11:12-28","chap":11,"sec":12},{"n":48,"question":"입다는 자식을 태워 제물로 바치겠다고 맹세합니다(30–31절). 이건 율법이 금지하는 행위가 아닌가요?","expl":"정확히 말해 입다가 자식을 태워 바치겠다고 서원하지는 않았습니다. 아마도 그는 승리 후 돌아올 때 가장 먼저 보게 될 존재가 자신의 집에 있는 가축 같은 것이라 생각했을 겁니다. 이와 같은 서원은 오늘 우리에게는 무척이나 낯선 관습이지만, 고대 이스라엘에서는 빈번하게 존재했습니다. 서원은 하나님의 도우심을 구하면서 그러한 도우심을 결코 잊지 않고 감사하겠다고 약속하는 것을 나타냅니다. 그리고 이러한 서원은 승리나 도우심이 그저 자신의 노력이 아니라 하나님께로부터 오는 것임을 고백하는 행위이기도 합니다. 입다의 서원에 문제가 있다면, 그가 무엇을 가장 먼저 볼지 몰랐는데 경솔하게 말했다는 점입니다.","c1":["정확히 자식을 바치겠다고 서원한 것이 아니라, 승리 후 돌아올 때 가장 먼저 보게 될 존재를 집에 있는 가축 같은 것으로 생각했을 것이기 때문","율법이 번제로 자식을 바치는 것을 허용했기 때문","하나님께서 입다에게 직접 그렇게 명령하셨기 때문"],"t2":"서원은 하나님의 {0}을 구하면서 그 도우심을 결코 잊지 않고 {1}하겠다고 약속하는 것입니다.","b2":[["도우심","심판","용서"],["감사","원망","자랑"]],"ref":"사사기 11:29-31","chap":11,"sec":29},{"n":49,"question":"딸을 제물로 바치게 된 상황(34–35절)은 누가 봐도 정도에서 벗어난 약속인데, 뒤늦게나마 용서를 구하고 철회할 수는 없었을까요?","expl":"서원은 자신에게 불리할지라도 반드시 지켜야 합니다(신 23:21–23). 그렇기에 서원은 아주 신중해야 하며 그 의미가 무엇인지 명확히 생각해야 합니다. 이를 고려할 때 입다의 서원은 참으로 어리석고 오만한 서원이었습니다. 결국 그는 서원대로 자신의 딸을 희생시킵니다. 구약성경이 증언하는 하나님은 신앙을 위해서라면 가족을 희생시켜도 되는 분이 결코 아닙니다. 사람은 기계나 로봇으로 만들어진 것이 아니라, 생각하고 판단할 수 있는 주체로 만들어졌습니다. 그렇다면 입다의 행동은 해서는 안 되는 행동이었습니다. 사사기 본문은 이에 대해 별다른 평가 없이 그저 일어난 일을 서술하면서 독자에게 판단을 맡깁니다. 이러한 방식은 입다의 이야기를 당연한 것으로 받아들이지 말고 독자와 청중 스스로 생각하며 판단하도록 초대합니다.","c1":["서원은 자신에게 불리해도 반드시 지켜야 하므로 처음부터 신중해야 하는데, 입다의 서원은 어리석고 오만한 서원이었기 때문","딸이 아버지의 서원을 철회하지 못하게 막았기 때문","제사장이 서원은 철회할 수 없다고 선언했기 때문"],"t2":"구약성경이 증언하는 하나님은 {0}을 위해서라면 가족을 희생시켜도 되는 분이 결코 아닙니다. 사람은 기계나 로봇이 아니라 생각하고 {1}할 수 있는 주체로 만들어졌습니다.","b2":[["신앙","전쟁","승리"],["판단","복종","순응"]],"ref":"사사기 11:34-40","chap":11,"sec":34},{"n":50,"question":"1절에서 보이는 에브라임 지파의 행동을 납득할 수 없습니다. 이렇게 억지를 부리는 배경을 알고 싶습니다.","expl":"기드온 시대에도 에브라임 지파는 오만한 모습으로 그려집니다(8:1–2). 당대에 가장 강력하고 세력이 컸던 지파였기에 그들의 위세는 대단했던 것 같습니다. 기드온은 그들 앞에서 자신을 낮춰 상황을 해결한 반면(8:2–3), 입다는 오히려 그들의 부당함을 격렬하게 드러내는 것으로 대응합니다. 이는 결국 입다가 속한 길르앗의 므낫세 지파와 에브라임 지파 사이의 대대적인 전쟁으로 이어집니다. 사사 시대에는 지파 간 독자성이 확실했고 각각의 지파가 어려움을 겪을 때 함께 도우며 서로를 지탱하기도 했지만, 여기에서 보듯 지파 이기주의에 몰입해 약한 지파를 가벼이 여기며 횡포를 부리는 일도 일어났습니다.","c1":["에브라임은 당대에 가장 강력한 지파라 오만했고, 지파 이기주의에 빠져 약한 지파를 가벼이 여기며 횡포를 부렸기 때문","에브라임이 입다를 사사로 인정하지 않았기 때문","에브라임이 길르앗 땅의 원래 주인이었기 때문"],"t2":"에브라임 지파는 기드온 시대에도 {0}한 모습으로 그려지며, 입다가 속한 길르앗의 {1} 지파와 대대적인 전쟁을 벌이게 됩니다.","b2":[["오만","겸손","온유"],["므낫세","단","유다"]],"ref":"사사기 12:1-7","chap":12,"sec":1},{"n":51,"question":"에브라임 사람들이 4절의 괄호 속 내용과 같은 말을 하는 근거는 무엇입니까?","expl":"이에 대한 구체적인 근거를 구약성경에서는 찾아볼 수 없습니다. 아마도 이러한 말은 당대 요단강 동쪽에 있던 므낫세 지파에 대한 요단강 서쪽 지파들의 통념을 반영한 것일 수 있습니다. 여호수아기에서 보듯 동쪽 지파는 서쪽 지파들이 자신들을 모른 체할까 두려워했습니다(수 22:24–25). 대다수 지파가 살았던 서쪽 지역에서 보기에 동쪽은 주변이자 변두리로 여겨졌을 것입니다. 특히 서쪽에서 세력이 컸던 에브라임 지파의 경우 동쪽 므낫세 지파의 핵심인 길르앗 사람들을 조롱하고 비웃고 업신여기느라 ‘도망자’로 폄하했다고 볼 수 있습니다.","c1":["구약성경에서 구체적 근거는 찾을 수 없고, 요단강 동쪽 므낫세 지파에 대한 서쪽 지파들의 통념을 반영한 것일 수 있기 때문","길르앗 사람이 에브라임에서 도망친 기록이 사사기 앞부분에 있기 때문","서쪽 지파가 동쪽으로 이주한 역사가 있었기 때문"],"t2":"에브라임의 말은 동쪽 므낫세 지파에 대한 서쪽 지파들의 {0}을 반영한 것일 수 있습니다. 서쪽에서 세력이 컸던 {1} 지파는 길르앗 사람들을 업신여겨 ‘도망자’로 폄하했다고 볼 수 있습니다.","b2":[["통념","증거","기록"],["에브라임","유다","베냐민"]],"ref":"사사기 12:1-7","chap":12,"sec":1},{"n":52,"question":"10장 4절에 언급된 야일의 경우처럼 압돈의 아들과 손자들도 나귀를 타고 다녔습니다(14절). 이게 뭐 그리 대단한 일이라고 기록에 남긴 거죠?","expl":"사사 야일과 압돈에 관한 본문에서 이들의 자녀가 나귀를 타고 다녔다고 언급한 것은 이들이 상당한 부와 위세를 지녔음을 표현한다고 봐야 할 것입니다. 본문 자체가 더 이상 어떤 평가를 내리지 않아서 이에 대해 단정해서 말하기는 어렵습니다. 한편으로 입산과 엘론, 압돈의 시대는 평화로워서 많은 자녀를 낳고 많은 부를 획득할 수 있었던 시대라고 알리는 것이기도 합니다. 다른 한편으로는 사사들마다 많은 자녀와 부를 축적하는 것이 왕권의 그림자를 얼핏 보여주는 시대임을 알리는 것이라 볼 수도 있습니다. 어쩌면 이와 같은 두 방향의 의미를 모두 전달하는 것이 본문의 의도일 수도 있습니다. 사사 시대는 평화를 향해 나가게 될까요, 아니면 왕권과 같은 권력 중심의 사회로 나가게 될까요?","c1":["자녀가 나귀를 탔다는 것은 상당한 부와 위세를 뜻하며, 평화로운 시대의 모습이면서 한편으로는 왕권의 그림자를 보여주는 것일 수 있기 때문","나귀가 당시 가장 빠른 전쟁 무기였기 때문","압돈이 이스라엘을 구원한 가장 큰 공적이었기 때문"],"t2":"아들과 손자가 나귀를 타고 다녔다는 것은 이들이 상당한 {0}와 위세를 지녔음을 표현합니다. 사사들마다 많은 자녀와 부를 축적하는 것은 {1}의 그림자를 얼핏 보여주는 시대임을 알리는 것이라 볼 수도 있습니다.","b2":[["부","학식","신앙"],["왕권","제사장","율법"]],"ref":"사사기 12:8-15","chap":12,"sec":8},{"n":53,"question":"블레셋은 어떤 민족입니까? 이스라엘과는 언제부터 부대끼기 시작했습니까?","expl":"블레셋은 오늘날의 그리스 남쪽 에게해에 있는 크레테 섬에서 유래한 민족으로 여겨집니다(암 9:7). 그들은 철기 문명에 기반을 둔 강력한 해양 세력이었으며, 기원전 12세기 무렵부터 아프리카 북부와 동부 지중해 연안으로 진출합니다. 당시 이집트는 해양 민족의 계속된 침략과 북쪽에서 일어난 히타이트와의 전투, 그리고 내부에서 시작된 붕괴로 인해 가나안 지역에 거의 힘을 발휘할 수 없었고, 그 힘의 공백기에 블레셋이 가나안 땅 해안 지역을 장악했습니다. 특히 그들의 다섯 도시인 가사, 아스돗, 아스글론, 가드, 에그론이 유명했습니다. 사사 시대부터 왕정 초기까지 블레셋은 이스라엘의 숙적이었습니다. 블레셋의 흔적은 이 지역 전체를 가리키는 이름이 ‘블레셋의 땅’이라는 뜻을 지닌 팔레스타인이라는 것에서 찾아볼 수 있습니다.","c1":["크레테 섬에서 유래한 철기 문명의 해양 세력으로, 이집트의 힘이 약해진 때에 가나안 해안을 장악하여 사사 시대부터 이스라엘의 숙적이 되었기 때문","이집트에서 탈출한 노예들의 후손으로 가나안에 먼저 정착한 민족이기 때문","북쪽 아시리아에서 내려온 유목 민족이기 때문"],"t2":"블레셋은 오늘날 그리스 남쪽 에게해의 {0} 섬에서 유래한 민족으로 여겨지며, ‘블레셋의 땅’이라는 뜻을 지닌 {1}이라는 이름에서 그 흔적을 찾을 수 있습니다.","b2":[["크레테","키프로스","시칠리아"],["팔레스타인","페르시아","이스라엘"]],"ref":"사사기 13:1-5","chap":13,"sec":1},{"n":54,"question":"‘나실 사람’(5절)은 어떤 부류의 사람들을 가리키는 말입니까?","expl":"‘나실 사람’은 ‘구별된 자’라는 의미인데, 하나님께 헌신하기 위해 자신을 구별하겠다고 서원한 사람을 가리킵니다. 이들은 일정 기간 동안 포도주를 비롯한 포도나무에서 자란 것을 먹지 않고, 머리를 자르지 않으며, 부정한 것에 닿지 않도록 유의했습니다(민 6:1–21). 평소에는 일상을 살아가지만, 특정한 기간에는 근본적으로 자신이 하나님의 사람이자 하나님께 구별된 사람임을 상기하고 표현하는 관행이 이러한 나실 사람 규정이라 할 수 있습니다. 어떤 이들은 평생을 나실 사람으로 드려지기도 했는데, 본문의 삼손이나 사무엘(삼상 1:11) 역시 그러했습니다. 나실 사람 규정은 이스라엘의 정체성과 연관된 오랜 신앙 전통이라 볼 수 있습니다.","c1":["하나님께 헌신하기 위해 자신을 구별하겠다고 서원한 사람","제사장 가문에서 태어나 성전에서 봉사하는 사람","전쟁에서 공을 세워 사사로 임명된 사람"],"t2":"나실 사람은 일정 기간 동안 {0}를 비롯한 포도나무에서 자란 것을 먹지 않고 머리를 자르지 않았으며, 삼손이나 {1}은 평생을 나실 사람으로 드려졌습니다.","b2":[["포도주","고기","우유"],["사무엘","다윗","엘리"]],"ref":"사사기 13:2-7","chap":13,"sec":2},{"n":55,"question":"마노아는 기도했고(8절) 주님은 그 기도를 들었습니다(9절). 세계 인구가 수십억인데, 하나님은 정말 한 사람 한 사람의 기도를 다 들으시나요?","expl":"어머니는 수많은 소리 가운데 자기 자녀의 목소리를 바로 구분해내곤 하지 않습니까? 사랑하는 이의 목소리와 모습을 멀리서도 알아보는 것을 두고 우리는 기적이라 말하지 않습니다. 그래서 주님께 구하는 자의 기도를 하나님께서 하나하나 들으신다는 것은 초자연적인 기적을 말하는 것이 아니라, 인간을 향한 하나님의 사랑을 말합니다. 하나님께서 들으시리라 믿고 구하는 것이야말로 하나님을 향한 사람의 사랑 표현이고, 하나님께서는 그 기도를 들으심으로 그 사랑을 표현하십니다. 특히 이집트 노예나 창녀의 아들 입다처럼, 작은 자의 기도에 예민하게 귀 기울이십니다. 왜냐하면 그들은 하나님 말고는 의지할 곳이 없는 이들이기 때문입니다.","c1":["자녀의 목소리를 알아듣는 어머니처럼, 기도를 들으시는 것은 초자연적인 기적이 아니라 인간을 향한 하나님의 사랑이기 때문","하나님은 대표 기도만 들으시고 개인의 기도는 천사들이 모아 전하기 때문","기도의 길이와 정성에 비례해서 응답하시기 때문"],"t2":"하나님께서 들으시리라 믿고 구하는 것이 하나님을 향한 사람의 {0} 표현이고, 하나님은 특히 {1}의 기도에 예민하게 귀 기울이십니다.","b2":[["사랑","두려움","의무"],["작은 자","큰 자","제사장"]],"ref":"사사기 13:8-14","chap":13,"sec":8},{"n":56,"question":"천사가 식사도, 통성명도 한사코 거부한(16–18절) 이유는 무엇입니까?","expl":"천사는 사람이 아니니 사람의 음식을 먹지 않습니다. 마노아의 대접이 번제라면 그 제사를 받아야 할 마땅한 존재는 오직 주 하나님이시니 자기가 그 제사를 받아서는 안 되었을 것입니다. 하나님의 보내심을 받은 천사는 자신의 역할과 이유를 명확하게 알고 있습니다. 이름은 단순히 몇 개의 글자가 아니라 한 존재의 정체성이며 전부를 상징합니다. 그렇기에 상대의 이름을 안다는 것은 상대를 파악하는 것이며, 나아가 그를 주관할 수도 있는 행위입니다. 그러나 하나님의 천사의 이름, 그리고 하나님의 이름은 비밀입니다. 이것은 하나님께서는 인간의 이해나 파악 너머의 분임을 의미합니다. 하나님께서는 그 이름으로 인간이 조종하거나 좌우할 수 없는 분임을 이와 같은 대화를 통해 보여줍니다.","c1":["천사는 사람의 음식을 먹지 않으며 제사는 하나님만 받으실 분이고, 하나님의 이름은 인간이 알아 조종할 수 없는 비밀이기 때문","마노아의 대접이 정성이 부족해 마음에 들지 않았기 때문","마노아가 이미 천사의 이름을 알고 있어 소개가 필요 없었기 때문"],"t2":"이름은 한 존재의 정체성이며 전부를 상징하기에, 상대의 이름을 안다는 것은 상대를 {0}하는 것이며 나아가 {1}할 수도 있는 행위입니다. 그러나 하나님의 이름은 비밀입니다.","b2":[["파악","비난","칭찬"],["주관","용서","외면"]],"ref":"사사기 13:15-23","chap":13,"sec":15},{"n":57,"question":"‘주님께서 내리시는 복’(24절)이란 무얼 가리킵니까? 큰돈이나 행운, 건강… 뭐 그런 건가요?","expl":"주님께서 주시는 복에는 당연히 건강도 있고, 필요한 돈도 있겠고, 행복한 주변 환경도 있습니다. 문제는 우리가 이것만을 추구하느라 주변을 모른 체하고 미친 듯이 달려가는 것, 그리고 하나님을 오직 이런 현세적 복을 주는 신으로만 여기는 것이지, 하나님께서 그분의 백성에게 이러한 복을 주시는 것은 문제가 아닐 겁니다. 우리를 사랑해주는 부모나 친구 역시 우리에게 이런 선물을 줄 때가 있듯이 말입니다. 그러나 하나님께서 주시는 가장 큰 복은 하나님을 알고 경외하고 신뢰하며 살아가도록 하신 것입니다. 하나님께서는 이 땅에 사람의 갓난아기로 태어나신 예수님이 자라면서 튼튼해지고 지혜롭게 하셨고(눅 2:40), 하나님과 사람에게 사랑받게 하셨습니다(눅 2:52). 하나님의 복을 받는다는 것은 이와 같은 모습으로 나타날 것입니다.","c1":["건강과 돈과 행복한 환경도 복이지만, 가장 큰 복은 하나님을 알고 경외하고 신뢰하며 살아가도록 하신 것","이 땅에서 큰돈과 행운을 얻는 것만이 복의 전부","고난 없이 평생 병들지 않는 것"],"t2":"하나님께서 주시는 가장 큰 복은 하나님을 알고 {0}하고 신뢰하며 살아가도록 하신 것입니다. 예수님이 자라면서 튼튼해지고 {1}롭게 하셨습니다(눅 2:40).","b2":[["경외","이용","원망"],["지혜","풍요","평화"]],"ref":"사사기 13:24-25","chap":13,"sec":24},{"n":58,"question":"삼손은 부모의 반대를 무릅쓰고 블레셋 여인을 아내로 얻습니다. 어차피 제 뜻대로 할 작정이면서 굳이 결혼을 ‘주선해’달라고(2절) 청한 까닭은 무엇입니까?","expl":"이 부분에서 삼손과 부모의 모습을 동시에 드러내기 위해 결혼 주선이라는 역할을 통해 부모를 등장시킨다고 볼 수 있습니다. 이방 민족과의 결혼은 분명히 규탄받을 행위입니다(3:6). 본문 4절은 놀랍게도 이 과정이 주님께서 블레셋을 치려고 행하시는 것이라 설명합니다. 삼손의 행동은 분명히 부적절합니다. 그렇지만 사사기 저자는 삼손의 옳지 못한 행동에도 불구하고 하나님께서 이스라엘을 위해 블레셋을 치시는 뜻을 이루어가신다는 점을 계속해서 보여줍니다. 하나님의 구원이 삼손의 행동을 결코 정당화할 수는 없겠지만, 사람의 부족함에도 불구하고 하나님께서는 여전히 그 백성을 위해 일하신다는 것을 삼손의 이 본문을 통해 볼 수 있습니다.","c1":["삼손과 부모의 모습을 함께 드러내려는 장치이며, 삼손의 잘못된 행동에도 하나님은 블레셋을 치시는 뜻을 이루어 가시기 때문","율법이 부모의 허락 없이 혼인하는 것을 금했기 때문","블레셋 여인의 부모가 중매인을 요구했기 때문"],"t2":"본문 4절은 이 과정이 주님께서 {0}을 치려고 행하시는 것이라 설명합니다. 사람의 부족함에도 불구하고 하나님께서는 여전히 그분의 {1}을 위해 일하십니다.","b2":[["블레셋","암몬","모압"],["백성","원수","제사장"]],"ref":"사사기 14:1-4","chap":14,"sec":1},{"n":59,"question":"마노아는 신부의 집으로 갔습니다(10절). 신랑의 아버지가 아들과 함께 신부의 집으로 가는 게 일반적인 이스라엘의 결혼 풍습입니까?","expl":"이스라엘만의 풍습이라기보다는 고대 중동 지역의 결혼 풍습 가운데 하나였다고 볼 수 있습니다. 신부는 친정에서 지내고, 신랑은 처가에서 함께 살거나 아니면 종종 처가를 방문하며 생활하는 방식이었습니다. 이러한 방식이 고대 사람들 모두가 지키는 풍습이었다기보다 이러한 풍습도 있었다 정도로 보는 것이 적절하겠습니다. 삼손 이야기에 그의 부모가 등장하는 것은 모두 삼손의 행동이 부적절하다는 것과 연관됩니다. 그는 부모에게 이방 여인과 결혼하겠다 말하고, 죽은 시체를 만져서는 안 되는데 시체에서 찍어낸 꿀을 부모에게 말없이 가져다주고, 이제는 아버지를 블레셋 사람과의 잔치 자리까지 이끕니다.","c1":["이스라엘만의 풍습이라기보다 고대 중동의 결혼 풍습 가운데 하나로, 신부는 친정에서 지내고 신랑이 처가를 방문하거나 함께 사는 방식이었기 때문","신명기 율법이 정한 이스라엘 고유의 결혼 규례였기 때문","블레셋 사람만의 풍습으로 이스라엘 사람은 따르지 않았기 때문"],"t2":"이러한 방식은 {0} 중동 지역의 결혼 풍습 가운데 하나였습니다. 신부는 {1}에서 지내고, 신랑은 처가에서 함께 살거나 종종 처가를 방문했습니다.","b2":[["고대","현대","근대"],["친정","시댁","성전"]],"ref":"사사기 14:5-20","chap":14,"sec":5},{"n":60,"question":"삼손은 어째서 내기와 아무 상관없는 아스글론 주민들을 30명이나 죽인 걸까요?(19절) 분풀이를 하려면 딤나 주민에게 해야 마땅하지 않나요?","expl":"엄밀히 따져보면 딤나 주민에게는 약속을 했으니 바로 분풀이하기는 어려웠을 것입니다. 딤나와 연관해서는 15장에서 더 다루어집니다. 내기에 진 삼손은 약속대로 옷을 마련해야 했고, 이를 위해 또 다른 블레셋 도시인 아스글론으로 가서 사람을 죽이고 옷을 마련해 옵니다. 놀랍게도 여기에도 ‘주님의 영’이 삼손에게 임한 것으로 나옵니다. 사사기 본문에 나오는 ‘주님의 영’은 대체로 ‘큰 능력’, ‘놀라운 변화’를 상징한다고 이해할 수 있습니다. 삼손의 행동을 정당하다고 말할 수 없습니다. 다만 이 상황을 통해 그동안 이스라엘에게 악을 행하던 블레셋을 하나님께서 심판하시는 것은 분명합니다. 삼손은 결코 올바르다 할 수 없으나, 하나님께서는 그렇게 하나님의 부르심과 어긋나는 삼손을 통해서도 이스라엘을 구원하십니다.","c1":["딤나 주민에게는 약속을 했으니 바로 분풀이하기 어려워, 옷을 마련하려고 다른 블레셋 도시 아스글론으로 갔기 때문","아스글론 주민이 수수께끼를 풀어 준 사람들이었기 때문","아스글론이 삼손의 고향을 공격한 도시였기 때문"],"t2":"사사기 본문에 나오는 ‘주님의 영’은 대체로 ‘큰 {0}’, ‘놀라운 {1}’를 상징한다고 이해할 수 있습니다.","b2":[["능력","평화","용서"],["변화","침묵","휴식"]],"ref":"사사기 14:10-20","chap":14,"sec":10},{"n":61,"question":"14장 4절에 따르면, 삼손이 사랑에 빠지는 사건 자체가 하나님의 큰 그림 가운데 있었습니다. 그렇다면 여기서 이렇게 계속 일이 어그러지는 것 역시 마찬가지인가요?","expl":"본문은 삼손의 행동을 묘사할 뿐 이렇다 저렇다 판단하지 않습니다. 그리고 독자와 청중에게 삼손의 행동에 대한 판단의 몫을 맡기고 있습니다. 보기에 좋았던 아내를 두고 화가 나서 떠났던 삼손이 염소 새끼를 일종의 화해의 예물로 들고 다시 찾아갔지만, 이미 그 여인은 삼손 친구의 아내가 되어버렸습니다. 우리는 여기에서도 삼손의 경솔함을 볼 수 있습니다. 그는 아내를 빼앗긴 일에 대한 복수를 제 손으로 하는데, 이 역시 원수를 갚지 말라는 말씀(신 32:35)과 충돌됩니다. 그러나 이 모든 과정을 통해 삼손은 블레셋과 맞서면서 블레셋에 큰 타격을 주게 됩니다.","c1":["본문은 판단하지 않고 독자에게 맡기는데, 삼손의 경솔함과 복수가 있었지만 결과적으로 삼손이 블레셋에 큰 타격을 주게 되기 때문","하나님이 삼손의 모든 행동을 직접 계획하고 정당화하셨기 때문","삼손의 행동은 모두 율법에 맞는 정당한 복수였기 때문"],"t2":"화가 나서 떠났던 삼손이 {0} 새끼를 화해의 예물로 들고 다시 찾아갔지만 아내는 이미 친구의 아내가 되어 있었습니다. 삼손의 복수는 {1}를 갚지 말라는 말씀(신 32:35)과 충돌됩니다.","b2":[["염소","양","비둘기"],["원수","빚","은혜"]],"ref":"사사기 15:1-8","chap":15,"sec":1},{"n":62,"question":"삼손 하나를 잡자고 3천 명이나 몰려갔습니다(11절). 이 큰 무리가 왜 필요한 거죠?","expl":"이제 사태는 바야흐로 삼손이 속한 단 지파를 넘어서 유다 지파까지 영향을 미치는 상황으로 확장되었습니다. 삼손을 잡으려고 수많은 블레셋이 이스라엘 땅으로 침공하자, 그에 놀란 유다 지파는 삼손을 잡아 넘기려고 3천 명이나 동원했습니다. 이 많은 숫자는 유다 지파가 블레셋과 싸우기를 전혀 원치 않았음을 보여주기 위한 의도적인 표현이라고 할 수 있습니다. 이스라엘은 블레셋의 압제를 어느새 당연한 것으로 여기며 싸울 생각조차 하지 않았고, 오직 협상으로 대응하며 ‘현재 상황(status quo)’을 유지하는 데만 관심을 두고 있습니다. 삼손의 행동은 이와 같은 안일하고 비겁한 평화를 깨뜨리는 시작이었습니다.","c1":["삼손의 일이 단 지파를 넘어 유다 지파까지 영향을 미치자, 블레셋과 싸울 마음이 없던 유다가 삼손을 넘기려고 많은 숫자를 동원했기 때문","삼손이 3천 명의 군사를 거느리고 있어서 맞서야 했기 때문","블레셋이 유다에 정확히 3천 명을 보내라고 요구했기 때문"],"t2":"이스라엘은 블레셋의 압제를 당연하게 여겨 싸울 생각조차 하지 않고 오직 {0}으로 대응하며 ‘{1}’을 유지하는 데만 관심을 두었습니다.","b2":[["협상","전쟁","기도"],["현재 상황","독립","승리"]],"ref":"사사기 15:9-13","chap":15,"sec":9},{"n":63,"question":"삼손 혼자서 여우 300마리를 잡았다니(4절), 당나귀 턱뼈 하나로 천 명을 죽였다니(15절) 하는 건 전부 ‘많음’을 나타내는 비유적 표현인 거죠?","expl":"사사기 곳곳에 “주님의 영이 임했다”라는 표현이 쓰인 것에서 보듯, 이 책은 역사를 전달하는 책이 아니라 하나님과 그분의 백성에 대해 전하는 책이며, 이를 위해 문학적 장치나 표현을 곳곳에 마련해둡니다. 300마리의 여우는 실제 숫자일 수도 있지만, 독자와 청중이 그 상황을 상상하도록 유도하는 장치이기도 합니다. 당나귀 턱뼈로 죽인 사람의 숫자가 천 명이었다는 부분 역시, 유다 지파는 블레셋과 싸우기는커녕 삼손을 넘기려고 3천 명이나 몰려왔지만 삼손은 턱뼈로 천 명을 죽였다는 대조를 보여주는 장치입니다. 블레셋을 두려워하지 말고 하나님을 신뢰하며 맞설 것을 이러한 장치로 촉구한다고 이해할 수 있습니다.","c1":["이 책은 역사를 전달하는 책이 아니라 하나님과 그분의 백성에 대해 전하는 책이라 문학적 장치를 쓰며, 블레셋을 두려워하지 말고 하나님을 신뢰하며 맞서도록 촉구하기 때문","고대의 숫자 표기가 부정확해서 후대에 부풀려졌기 때문","삼손을 영웅으로 만들려는 목적으로 과장했기 때문"],"t2":"사사기 곳곳에 “주님의 영이 임했다”는 표현이 쓰인 것은 이 책이 {0}를 전달하는 책이 아니라 하나님과 그분의 백성에 대해 전하는 책이기 때문입니다. 삼손은 {1}로 천 명을 죽였습니다.","b2":[["역사","법률","족보"],["턱뼈","칼","창"]],"ref":"사사기 15:14-17","chap":15,"sec":14},{"n":64,"question":"‘라맛레히’(17절)와 ‘엔학고레’(19절)라는 이름에는 특별한 의미가 담겼을 성싶습니다.","expl":"‘라맛레히’는 ‘턱뼈의 산’을 뜻합니다. 삼손이 당나귀 턱뼈로 무수한 블레셋 사람을 죽였고 그 시체가 산더미 같았다는 데서 유래했으며, ‘턱뼈로 만든 (시체의) 산’을 의미합니다. 턱뼈와 같은 보잘것없는 도구로도 그 강한 블레셋을 이길 수 있음을 증언하는 라맛레히는 현재의 상황을 당연한 것으로 받아들이지 말고 하나님을 신뢰하며 용기 있게 일어설 것을 촉구합니다. ‘엔학고레’는 ‘부르짖는 자의 샘’입니다. 목이 말라 부르짖을 때 하나님께서 그 곁에 샘이 나게 하신 것을 기념해 이러한 이름을 붙였습니다. 구약성경에는 이처럼 하나님께서 행하신 특별한 사건을 기념해 이름을 붙이는 경우가 빈번합니다. 이를 통해 대대손손 하나님의 행하심을 기억하며 기념하게 합니다.","c1":["라맛레히는 ‘턱뼈의 산’, 엔학고레는 ‘부르짖는 자의 샘’으로, 하나님께서 행하신 일을 대대손손 기억하게 하려고 붙인 이름이기 때문","삼손의 고향과 출신 지파를 기념하는 이름이기 때문","블레셋 사람들이 붙인 지명을 그대로 쓴 것이기 때문"],"t2":"‘라맛레히’는 ‘{0}의 산’을 뜻하고, ‘엔학고레’는 ‘{1}는 자의 샘’입니다.","b2":[["턱뼈","칼","승리"],["부르짖","기도하","노래하"]],"ref":"사사기 15:14-20","chap":15,"sec":14},{"n":65,"question":"‘가사’(1절)와 ‘소렉 골짜기’(4절)는 어느 나라 땅입니까? 설마 다시 블레셋 땅에 들어갔다는 뜻은 아니죠?","expl":"가사는 블레셋을 대표하는 다섯 도시 가운데 가장 남쪽에 위치한 곳이며, 소렉 골짜기는 블레셋과 이스라엘 사이에 놓인 지역입니다. 소렉 골짜기 서편에 삼손의 출신 지역인 소라와 에스다올이 있고, 그 동편에 딤나가 있습니다. 블레셋의 세력이 미치던 곳이었지만 이즈음 삼손의 활약을 통해 점차 이스라엘의 영향권으로 바뀌어가고 있었습니다. 가사까지 언급되었다는 것은 삼손과 이스라엘의 영향력이 블레셋 최남단 지역까지 미쳤음을 보여줍니다. 그렇지만 결국 삼손이 가사에서 죽게 된다는 점(21절)은 블레셋과의 싸움이 쉽지 않았음을 보여줍니다.","c1":["가사는 블레셋의 다섯 도시 중 가장 남쪽 도시이고, 소렉 골짜기는 블레셋과 이스라엘 사이에 놓인 지역이기 때문","둘 다 이스라엘 지파의 땅이기 때문","둘 다 모압 땅이기 때문"],"t2":"가사는 블레셋을 대표하는 {0} 도시 가운데 가장 남쪽에 위치하고, 소렉 골짜기는 블레셋과 {1} 사이에 놓인 지역입니다.","b2":[["다섯","세","열"],["이스라엘","이집트","암몬"]],"ref":"사사기 16:1-4","chap":16,"sec":1},{"n":66,"question":"들릴라는 세 번이나 삼손을 시험합니다(6–14절). ‘하나님의 영’이 함께하는 사사라면 여인의 속셈을 눈치챘어야 마땅하지 않을까요?","expl":"딤나의 여성, 가사의 창녀, 소렉 골짜기의 들릴라까지, 삼손의 부적절한 행동은 줄곧 여성과 연관되어 있습니다. 사사기에서 ‘하나님의 영’은 ‘특별한 능력과 힘’이라는 표현과 동의어처럼 쓰이지만, 사람의 판단이나 분별과는 무관하게 사용된다고 할 수 있습니다. 그래서 하나님의 영이 있다고 해서 사람이 올바른 판단을 내리는 것으로 연결되지는 않습니다. 사사기는 삼손의 행동을 그저 객관적으로 보여주면서, 독자와 청중에게 판단을 맡깁니다. 이처럼 삼손 이야기는 동의하기 어려운 삼손의 행동, 그리고 그럼에도 불구하고 그의 행적을 통해 블레셋 세력을 약화시키는 하나님의 행하심이 엉켜 있습니다.","c1":["‘하나님의 영’은 특별한 능력과 힘을 뜻할 뿐, 사람의 판단이나 분별과는 무관하게 사용되기 때문","하나님의 영이 임하면 모든 속임수를 알아차리기 때문","삼손이 들릴라의 속셈을 알면서도 하나님의 명령이라 여기고 따랐기 때문"],"t2":"사사기에서 ‘하나님의 영’은 ‘특별한 {0}과 힘’과 동의어처럼 쓰이지만, 사람의 {1}이나 분별과는 무관하게 사용됩니다.","b2":[["능력","지혜","믿음"],["판단","순종","성품"]],"ref":"사사기 16:4-14","chap":16,"sec":4},{"n":67,"question":"머리털을 자르자 힘도 빠졌습니다. 정말 머리털이 힘의 원천(17절)이었을까요?","expl":"당연히 머리털은 상징적으로 이해해야 할 것입니다. 머리카락이 잘린 삼손의 모습은 하나님의 부르심을 소홀히 여긴 사람과 그로 인해 주신 복을 거두어버리시는 하나님, 그리고 하나님만이 능력의 원천이었으나 자신의 능력인 것처럼 오만했던 사람의 몰락을 상징적으로 보여줍니다. 어머니의 태에서부터 나실 사람으로 구별된 삼손은 들릴라의 무릎을 베고 누웠을 때, 즉 마치 어머니의 태에 다시 누운 모습처럼 되었을 때(19절) 나실 사람 서원과 연관된 머리카락이 잘리고 말았습니다. 삼손은 3명의 여성을 쫓으며 나실 사람으로서 자신을 분별하지 않았으며, 자신의 능력에 대해 자신감은 가득했을지 모르나 결국 여성에 의해 죽고 말았습니다.","c1":["머리털은 상징으로, 하나님의 부르심을 소홀히 여긴 사람과 복을 거두시는 하나님, 자신의 능력인 양 오만했던 사람의 몰락을 보여주기 때문","머리카락 자체에 초자연적인 힘이 깃들어 있었기 때문","들릴라가 마법으로 힘을 빼앗았기 때문"],"t2":"삼손은 어머니의 태에서부터 {0} 사람으로 구별되었는데, 들릴라의 무릎을 베고 누웠을 때 {1}과 연관된 머리카락이 잘리고 말았습니다.","b2":[["나실","레위","제사장"],["서원","전쟁","결혼"]],"ref":"사사기 16:15-22","chap":16,"sec":15},{"n":68,"question":"들릴라는 아무런 벌도 받지 않았고, 오히려 큰돈을 번 것 같습니다. 들릴라는 어떤 여성이었나요?","expl":"들릴라의 출신 지역인 소렉 골짜기는 블레셋과 이스라엘의 접경 지역이기에, 그녀는 블레셋 여인일 수도 있고 이스라엘 여인일 수도 있습니다. 그녀는 오직 들릴라라는 자신의 이름으로만 등장한다는 점에서, 매우 독립적이고 주체적인 여성이라 볼 수 있습니다. 사실 적장을 무찌른 드보라, 야엘과 더불어 들릴라 역시 당대의 영웅을 제거한 여성이라는 사사기의 일관된 흐름에 닿아 있기도 합니다. 성적 매력을 이용해 중요한 역사적 인물과 연결되는 여성들의 이야기는 이후에도 곳곳에 나타납니다(밧세바, 에스더, 유딧 등). 사사기 저자는 그녀에 대한 판단을 독자에게 맡깁니다. 우리는 자신이 가진 능력을 과연 무엇을 위해 사용할지 돌아보게 됩니다.","c1":["소렉 골짜기 출신으로 블레셋 여인일 수도 이스라엘 여인일 수도 있으며, 자기 이름으로만 등장하는 독립적이고 주체적인 여성이기 때문","삼손의 정실 아내로 끝까지 남편을 사랑한 여인이기 때문","블레셋 왕의 딸로서 나라를 위해 희생한 공주이기 때문"],"t2":"들릴라는 드보라, {0}과 더불어 당대의 영웅을 제거한 여성이라는 사사기의 일관된 흐름에 닿아 있습니다. 사사기 저자는 그녀에 대한 {1}을 독자에게 맡깁니다.","b2":[["야엘","한나","룻"],["판단","변호","칭찬"]],"ref":"사사기 16:4-22","chap":16,"sec":4},{"n":69,"question":"28절은 블레셋인들에 대한 개인적인 원한을 갚게 해달라는 기도처럼 보입니다. 하나님은 이처럼 사사로운 복수를 도와주는 신입니까?","expl":"삼손을 사로잡은 사건을 블레셋 사람들은 “우리 땅을 망쳐놓은 원수를 우리 신이 우리 손에 넘겨주셨다”(23–24절)고 표현합니다. 이들에게 이 사건은 블레셋의 신이 그의 능력을 보여준 사건이었습니다. 이를 고려하면 삼손의 마지막 기도는 삼손 개인의 복수이면서 동시에 이스라엘의 복수라고 볼 수 있습니다. 삼손은 내내 자신의 욕망을 따라 여러 여자를 찾아다녔지만, 마지막에는 블레셋을 무찌르는 일에 자신의 목숨을 내놓았습니다. 삼손은 하나님의 사람이라면 이러이러해야 한다는 모든 기대를 허물어뜨립니다. 동시에 삼손의 이야기는 사람의 연약함과 부족함에도 불구하고 그를 통해 이스라엘을 구원하시는 하나님을 단적으로 보여줍니다.","c1":["삼손의 마지막 기도는 개인의 복수이면서 동시에 이스라엘의 복수이고, 삼손의 연약함에도 그를 통해 이스라엘을 구원하시는 하나님을 보여주기 때문","하나님은 개인의 분노와 사사로운 복수를 기꺼이 도와주시는 신이기 때문","삼손이 기도할 때 하나님 대신 자기 힘을 의지했기 때문"],"t2":"삼손은 내내 자신의 {0}을 따라 여러 여자를 찾아다녔지만, 마지막에는 블레셋을 무찌르는 일에 자신의 {1}을 내놓았습니다.","b2":[["욕망","지혜","소명"],["목숨","재산","시간"]],"ref":"사사기 16:23-31","chap":16,"sec":23},{"n":70,"question":"2절에서 말하는 ‘주’는 히브리인들의 하나님을 말합니까? 그렇다면 목상을 만드는 데 돈을 쓰겠다는 3절과 어울리지 않습니다.","expl":"등장인물들은 입으로는 계속 이스라엘의 하나님을 운운하면서도 정작 하나님께서 가장 싫어하시는 우상을 만듭니다. 미가라는 이름은 “주님 같은 이가 누가 있으랴”라는 의미로, 주 하나님을 향한 찬양과 고백이 담겨 있지만, 정작 이 미가는 어머니의 돈을 훔쳤고, 어머니의 저주를 듣고 돈을 돌려줍니다. 또 그의 어머니는 훔친 이를 저주했다가 당사자가 아들임을 알고는 다시 주님의 이름으로 축복하며, 그 돈으로 우상을 만들기로 합니다. 문제가 되었던 돈은 은 천백 세겔이지만, 정작 우상을 만드는 데 소요된 비용은 200세겔이며, 나머지 돈의 행방은 묘연합니다. 본문은 풍자와 아이러니를 통해 이 시대가 얼마나 주님으로부터 떨어져나갔는지 적나라하게 드러냅니다.","c1":["입으로는 이스라엘의 하나님을 말하면서도 정작 하나님이 싫어하시는 우상을 만들며, 풍자와 아이러니로 이 시대가 주님에게서 얼마나 떨어졌는지 드러내기 때문","‘주’가 사실 바알을 가리키는 말이기 때문","목상은 율법이 허용한 성막의 기구이기 때문"],"t2":"미가라는 이름은 “주님 같은 이가 누가 있으랴”라는 뜻이지만, 정작 미가는 어머니의 {0}을 훔쳤습니다. 우상을 만드는 데 쓰인 돈은 은 {1}세겔이었습니다.","b2":[["돈","양","옷"],["200","100","500"]],"ref":"사사기 17:1-6","chap":17,"sec":1},{"n":71,"question":"5절에 등장하는 미가의 ‘신당’은 누구를 섬기는 신당입니까? 미가는 무슨 권리로 자기 아들을 제사장으로 삼았습니까?","expl":"1–4절에서 보듯, 미가는 주 하나님을 믿는 신앙인입니다. 아마도 그 시대에는 이스라엘의 유력한 집마다 이러한 하나님의 집, 신당이 있었을 것이라 여겨집니다(참고, 6:25). 미가는 자신의 신당에 우상을 만들어 세웠으며, 제멋대로 자기 아들들 가운데 제사장을 세우기도 합니다. 이렇게 자신의 집에 신당을 만들고 우상을 세우고 마음대로 제사장을 세우는 행태는 훗날 북왕국을 시작한 왕 여로보암이 행했던 일이기도 합니다(왕상 12:26–33). 사사기는 이 시대가 주님을 섬기는 신앙과 바알 종교를 대표하는 우상이 어떻게 엉켜 있었는지 고발합니다. 그래서 6절은 이 시대를 가리켜 ‘저마다 자기의 뜻에 맞는 대로’ 행한 시대라고 표현합니다.","c1":["미가는 주 하나님을 믿는 신앙인이고, 당시 유력한 집마다 하나님의 집(신당)이 있었는데, 미가는 거기에 우상을 세우고 제멋대로 제사장을 세웠기 때문","바알을 섬기는 신당이며 이방 제사장 제도를 따른 것이기 때문","하나님께서 직접 미가의 아들을 제사장으로 지명하셨기 때문"],"t2":"신당을 만들고 우상을 세우고 마음대로 제사장을 세우는 행태는 훗날 북왕국을 시작한 왕 {0}이 행했던 일이기도 합니다. 6절은 이 시대를 ‘저마다 자기의 {1}에 맞는 대로’ 행한 시대라고 표현합니다.","b2":[["여로보암","르호보암","아합"],["뜻","형편","이익"]],"ref":"사사기 17:5-13","chap":17,"sec":5}];
var START="2026-11-23";
var app=document.getElementById("app");
var soundOn=true, AC=null;
function ctx(){ if(!AC){var C=window.AudioContext||window.webkitAudioContext; if(!C) return null; AC=new C();} if(AC.state==="suspended") AC.resume(); return AC; }
function tone(f,t0,dur,type,vol){ var c=ctx(); if(!c) return; var o=c.createOscillator(), g=c.createGain(); var t=c.currentTime+t0; o.type=type; o.frequency.value=f; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.05); }
function bell(f,t0,dur){ tone(f,t0,dur,"sine",0.35); tone(f*2,t0,dur*0.7,"sine",0.12); tone(f*3,t0,dur*0.4,"sine",0.05); }
function dingdongdang(){ if(!soundOn) return; bell(880,0,0.55); bell(698.5,0.38,0.55); bell(1046.5,0.76,1.2); }
function bee(){ if(!soundOn) return; tone(1000,0,0.9,"square",0.14); if(navigator.vibrate) navigator.vibrate(250); }
function fanfare(){ if(!soundOn) return; [523,659,784,1047].forEach(function(f,i){ bell(f,i*0.16,0.6); }); }
document.getElementById("snd").onclick=function(){ soundOn=!soundOn; this.textContent=soundOn?"소리 켬":"소리 끔"; if(soundOn){ctx();} };

function kstToday(){ return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul"}).format(new Date()); }
function unlockedIndex(){ var t=new Date(kstToday()+"T00:00:00Z"), d=new Date(START+"T00:00:00Z"), n=0; if(t<d) return -1; while(d<=t){ if(d.getUTCDay()!==0) n++; d=new Date(d.getTime()+86400000);} return Math.min(n-1,DATA.length-1); }
function isSunday(){ return new Date(kstToday()+"T00:00:00Z").getUTCDay()===0; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
var CIRC=["①","②","③","④"];

var params=new URLSearchParams(location.search);
var ui=unlockedIndex();
var cur=ui;
if(params.get("d")){ var k=DATA.findIndex(function(x){return x.n==parseInt(params.get("d"),10)}); if(k>=0){ cur=k; if(k>ui) ui=k; } }
if(cur<0) cur=0;
var st; // state
function key(n){ return "bq_"+n; }
var MEM={};
function saved(n){ if(MEM[n]!==undefined) return MEM[n]; try{ return localStorage.getItem(key(n)); }catch(e){ return null; } }
function save(n,v){ MEM[n]=v; try{ localStorage.setItem(key(n),v); }catch(e){} }
function streak(n){ var s=0; for(var i=n;i>=DATA[0].n;i--){ if(saved(i)!==null) s++; else break; } return s; }

function dayPicker(){
  var h='<select id="pick">';
  for(var i=ui;i>=0;i--){ h+='<option value="'+i+'"'+(i===cur?' selected':'')+'>'+DATA[i].n+'번'+(saved(DATA[i].n)!==null?' (완료)':'')+'</option>'; }
  return h+'</select>';
}
function bible(d){ return "https://www.bskorea.or.kr/bible/korbibReadpage.php?version=GAE&book=jdg&chap="+d.chap+"&sec="+d.sec+"&cVersion=SAE%5E&fontSize=15px&fontWeight=normal"; }
function intro(){
  var d=DATA[cur];
  var msg="";
  if(ui<0 && !params.get("d")) msg='<div class="card center"><div class="big">&#128214;</div><b>11월 23일(월)부터 시작합니다!</b><p class="sub">그날 아침 7시에 만나요.</p></div>';
  else if(isSunday() && !params.get("d")) msg='<p class="sub center">오늘은 쉬는 날입니다. 지난 퀴즈를 다시 풀어 보세요.</p>';
  var done=saved(d.n);
  app.innerHTML=msg+'<div class="card center"><span class="tag">오늘의 성경퀴즈</span><div class="big">'+d.n+'번</div><p class="q">오늘 본문: '+esc(d.ref)+'</p>'+
   '<a class="btn alt" style="text-decoration:none" target="_blank" rel="noopener" href="'+bible(d)+'">성경 본문 읽기</a></div>'+
   '<div class="card"><span class="tag">1단계</span> <b>질문과 해설 읽기</b><div class="q" style="margin-top:12px">'+esc(d.n+". "+d.question)+'</div><div class="expl"><b>해설</b>\n'+esc(d.expl)+'</div></div>'+
   '<div class="card center"><span class="tag">2단계</span> <b>퀴즈 풀기</b>'+
   '<p class="sub">정답이면 &quot;딩동댕&quot;, 오답이면 &quot;삐&quot; 소리가 나고<br>풀고 나면 해설이 바로 나옵니다.</p>'+
   (done!==null?'<p class="sub">이미 푼 문제입니다 ('+done+'/2). 다시 풀어도 됩니다.</p>':'')+
   '<button class="btn" id="go">퀴즈 시작</button></div>'+
   '<div class="card"><span class="sub">다른 날 퀴즈 선택</span><br>'+(ui>=0?dayPicker():'')+'</div>';
  document.getElementById("go").onclick=function(){ ctx(); start(); };
  var p=document.getElementById("pick"); if(p) p.onchange=function(){ cur=parseInt(this.value,10); intro(); };
}
function start(){ var d=DATA[cur]; st={d:d,score:0,res:[null,null],opts1:shuffle(d.c1.map(function(t,i){return {t:t,ok:i===0};})),bi:0,okAll:true}; q1(); }
function dots(step){ var h='<div class="dots">'; for(var i=0;i<2;i++){ var c=st.res[i]===true?'ok':(st.res[i]===false?'no':(i===step?'on':'')); h+='<div class="dot '+c+'"></div>'; } return h+'</div>'; }
function explBox(){ return '<div class="expl"><b>해설</b>\n'+esc(st.d.expl)+'</div>'; }

function q1(){
  var d=st.d;
  var h=dots(0)+'<div class="card"><span class="tag">문제 1</span><div class="q">'+esc(d.question)+'</div><div class="sub">이 질문의 답을 보기에서 고르세요.</div><div id="ch">';
  st.opts1.forEach(function(o,i){ h+='<button class="choice" data-i="'+i+'"><span class="no">'+CIRC[i]+'</span>'+esc(o.t)+'</button>'; });
  h+='</div><div id="after"></div></div>';
  app.innerHTML=h;
  var bs=app.querySelectorAll(".choice");
  bs.forEach(function(b){ b.onclick=function(){
    var i=parseInt(b.dataset.i,10), ok=st.opts1[i].ok;
    bs.forEach(function(x,j){ x.disabled=true; if(st.opts1[j].ok) x.classList.add("right"); });
    if(!ok) b.classList.add("wrong");
    st.res[0]=ok; if(ok) st.score++;
    if(ok) dingdongdang(); else bee();
    document.getElementById("after").innerHTML='<div class="fb '+(ok?'ok':'no')+'">'+(ok?'딩동댕! 정답입니다':'삐~ 오답입니다. 초록색이 정답이에요')+'</div>'+explBox()+'<button class="btn" id="nx">다음 문제</button>';
    document.getElementById("nx").onclick=q2;
    document.getElementById("after").scrollIntoView({behavior:"smooth",block:"nearest"});
  }; });
}
function q2(){
  st.bi=0; st.picked=[]; st.okAll=true; st.opts2=st.d.b2.map(function(b){ return shuffle(b.map(function(t,i){return {t:t,ok:i===0};})); });
  drawQ2();
}
function sentence(){
  var t=esc(st.d.t2);
  st.d.b2.forEach(function(b,i){
    var cls="blank", txt="&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;";
    if(i<st.picked.length){ cls+=st.picked[i].ok?" ok":" no"; txt=esc(st.d.b2[i][0]); }
    else if(i===st.bi){ cls+=" cur"; txt="&nbsp;"+String.fromCharCode(65+i)+"&nbsp;"; }
    else txt=String.fromCharCode(65+i);
    t=t.replace("{"+i+"}",'<span class="'+cls+'">'+txt+'</span>');
  });
  return t;
}
function drawQ2(done){
  var h=dots(1)+'<div class="card"><span class="tag">문제 2</span><div class="sub">해설 글의 빈칸에 알맞은 말을 고르세요. ('+Math.min(st.bi+1,st.d.b2.length)+'/'+st.d.b2.length+')</div><div class="sentence">'+sentence()+'</div><div id="ch">';
  if(!done){ st.opts2[st.bi].forEach(function(o,i){ h+='<button class="choice" data-i="'+i+'"><span class="no">'+CIRC[i]+'</span>'+esc(o.t)+'</button>'; }); }
  h+='</div><div id="after"></div></div>';
  app.innerHTML=h;
  if(done){ finishQ2(); return; }
  var bs=app.querySelectorAll(".choice");
  bs.forEach(function(b){ b.onclick=function(){
    var i=parseInt(b.dataset.i,10), o=st.opts2[st.bi][i];
    bs.forEach(function(x,j){ x.disabled=true; if(st.opts2[st.bi][j].ok) x.classList.add("right"); });
    if(!o.ok){ b.classList.add("wrong"); st.okAll=false; }
    st.picked.push(o);
    if(o.ok) dingdongdang(); else bee();
    var last=(st.bi===st.d.b2.length-1);
    document.getElementById("after").innerHTML='<div class="fb '+(o.ok?'ok':'no')+'">'+(o.ok?'딩동댕! 정답입니다':'삐~ 오답입니다. 정답: '+esc(st.d.b2[st.bi][0]))+'</div><button class="btn" id="nx2">'+(last?'해설 보기':'다음 빈칸')+'</button>';
    document.getElementById("nx2").onclick=function(){ if(last){ drawQ2(true); } else { st.bi++; drawQ2(); } };
  }; });
}
function finishQ2(){
  st.res[1]=st.okAll; if(st.okAll) st.score++;
  document.getElementById("after").innerHTML='<div class="fb '+(st.okAll?'ok':'no')+'">'+(st.okAll?'모두 정답입니다!':'아쉬워요. 해설을 읽어 보세요.')+'</div>'+explBox()+'<button class="btn" id="res">결과 보기</button>';
  document.getElementById("res").onclick=result;
  app.querySelectorAll(".dot")[1].className="dot "+(st.okAll?"ok":"no");
}
function result(){
  var d=st.d, s=st.score; save(d.n,String(s)); fanfare();
  var emoji=s===2?"&#127942;":(s===1?"&#128077;":"&#128170;");
  var msg=s===2?"만점입니다! 대단해요!":(s===1?"잘했어요! 내일은 만점 도전!":"괜찮아요. 해설을 읽은 것만으로도 큰 공부입니다!");
  var share=d.n+"번 성경퀴즈 "+s+"/2 "+(s===2?"만점!":"완료!");
  app.innerHTML=dots(2).replace(/dot /g,"dot ")+'<div class="card center"><div class="big">'+emoji+'</div><div class="q">'+d.n+'번 결과: 2문제 중 '+s+'문제 정답</div><p>'+msg+'</p><p class="sub">지금까지 연속 '+streak(d.n)+'일째 참여 중</p>'+
   '<button class="btn" id="cp">결과 복사해서 단톡방에 올리기</button><button class="btn alt" id="rt">다시 풀기</button><button class="btn alt" id="hm">처음으로</button></div>';
  app.querySelectorAll(".dot").forEach(function(x,i){ if(i<2) x.className="dot "+(st.res[i]?"ok":"no"); else x.className="dot on"; });
  document.getElementById("cp").onclick=function(){ var b=this; var done=function(){ b.textContent="복사됨! 카톡방에 붙여넣기 하세요"; };
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(share).then(done,function(){ prompt("복사해서 사용하세요",share); }); } else { prompt("복사해서 사용하세요",share); } };
  document.getElementById("rt").onclick=start;
  document.getElementById("hm").onclick=intro;
}
intro();
</script></body></html>
